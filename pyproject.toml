[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-memory-backend"
version = "0.1.0"
description = "Customizable backend for testing memory approaches on generative AI agents"
authors = [{name = "Your Name"}]
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "langfuse>=2.60.0",
    "langchain-google-genai>=2.1.0",
    "google-genai>=0.8.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "loguru>=0.7.0",        # for logging
    "faiss-cpu>=1.7.4",     # for RAG memory backend
    "numpy>=1.24.0",        # for faiss
    "google-generativeai>=0.3.0",  # for Google Embeddings API
    "pyyaml>=6.0.0",        # for config management
    "pymongo>=4.6.0",       # for MongoDB connections
    "pytest",  
    "langchain-community", 
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"